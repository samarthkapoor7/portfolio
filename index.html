<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary meta -->
    <title>Samarth Kapoor — Full Stack &amp; AI Developer</title>
    <meta
      name="description"
      content="Samarth Kapoor is a Full Stack & AI Developer in Bengaluru building AI voice agents, LLM-powered workflows, and scalable SaaS products."
    />
    <meta name="author" content="Samarth Kapoor" />
    <meta name="theme-color" content="#0E0E0E" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Samarth Kapoor — Full Stack & AI Developer" />
    <meta
      property="og:description"
      content="Building AI voice agents, LLM-powered workflows, and scalable SaaS products. Bengaluru, India."
    />
    <meta property="og:image" content="/og.svg" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Samarth Kapoor — Full Stack & AI Developer" />
    <meta
      name="twitter:description"
      content="Building AI voice agents, LLM-powered workflows, and scalable SaaS products."
    />
    <meta name="twitter:image" content="/og.svg" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- No-flash theme: set data-theme before paint -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("theme");
          var theme =
            stored ||
            (window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light");
          document.documentElement.setAttribute("data-theme", theme);
        } catch (e) {}
      })();
    </script>

    <!-- Fonts: Clash Display (headline) + Fraunces (serif accent) + Inter (body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://api.fontshare.com" crossorigin />
    <link rel="preconnect" href="https://cdn.fontshare.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,300..500&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://api.fontshare.com/v2/css?f[]=clash-display@400,500,600,700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
